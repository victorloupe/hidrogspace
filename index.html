<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu - Hidro G</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header d-flex align-items-center">
  <img src="logohidrog.png" alt="Hidro G" style="height:50px;">
  <nav class="d-flex gap-2 ms-auto">
    <a class="btn btn-brand btn-sm text-white" href="index.html"><i class="fa-solid fa-house"></i> Menu</a>
    <a class="btn btn-outline-secondary btn-sm" href="relatorio.html"><i class="fa-solid fa-table-list"></i> Relatorio</a>
    <a class="btn btn-outline-secondary btn-sm" href="cadastro.html"><i class="fa-solid fa-plus"></i> Novo</a>
    <button class="btn btn-sm btn-outline-danger" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
  </nav>
</header>

<div class="wrap">

  <!-- KPIs -->
  <div class="row g-3 mb-4" id="kpiRow">
    <div class="col-6 col-md-3">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#eff6ff;color:#3b82f6"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <div>
          <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em">Total</div>
          <div class="fw-bold" style="font-size:1.1rem; line-height:1.2" id="kpiTotal">—</div>
          <div class="text-muted fw-semibold" style="font-size:.8rem" id="kpiTotalVal">R$ 0,00</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#fef3c7;color:#d97706"><i class="fa-solid fa-clock"></i></div>
        <div>
          <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em">Vence em breve</div>
          <div class="fw-bold" style="font-size:1.1rem; line-height:1.2" id="kpiSoon">—</div>
          <div class="text-muted fw-semibold" style="font-size:.8rem" id="kpiSoonVal">R$ 0,00</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#fee2e2;color:#ef4444"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div>
          <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em">Vencidos</div>
          <div class="fw-bold" style="font-size:1.1rem; line-height:1.2" id="kpiExpired">—</div>
          <div class="text-muted fw-semibold" style="font-size:.8rem" id="kpiExpiredVal">R$ 0,00</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#d1fae5;color:#10b981"><i class="fa-solid fa-check-circle"></i></div>
        <div>
          <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em">Em aberto</div>
          <div class="fw-bold" style="font-size:1.1rem; line-height:1.2" id="kpiOpen">—</div>
          <div class="text-muted fw-semibold" style="font-size:.8rem" id="kpiOpenVal">R$ 0,00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Acoes rapidas -->
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="kpi-icon" style="background:var(--brand-50);color:var(--brand);width:52px;height:52px;font-size:1.4rem;border-radius:12px">
            <i class="fa-solid fa-plus"></i>
          </div>
          <div class="flex-grow-1">
            <h6 class="mb-1 fw-bold">Novo Orcamento</h6>
            <p class="text-muted mb-0" style="font-size:.85rem">Crie um orcamento rapidamente</p>
          </div>
          <a class="btn btn-brand" href="cadastro.html" id="btnNovo">
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="kpi-icon" style="background:#f0fdf4;color:#16a34a;width:52px;height:52px;font-size:1.4rem;border-radius:12px">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <div class="flex-grow-1">
            <h6 class="mb-1 fw-bold">Todos os Orcamentos</h6>
            <p class="text-muted mb-0" style="font-size:.85rem">Veja, edite e gerencie</p>
          </div>
          <a class="btn btn-outline-secondary" href="relatorio.html">
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Vencendo em breve -->
  <div class="card">
    <div class="card-body p-0">
      <div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
        <div class="d-flex align-items-center gap-2">
          <i class="fa-regular fa-hourglass-half" style="color:var(--brand)"></i>
          <h6 class="mb-0 fw-bold">Vencem nos proximos 10 dias</h6>
        </div>
        <span class="chip"><span id="countSoon">0</span> proximos</span>
      </div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>#</th><th>Cliente</th><th>Total</th>
              <th>Emissao</th><th>Validade</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="tbodySoon"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="utils.js"></script>
<script>
function makeBadge(st) {
  return '<span class="badge-status ' + st.key + '">' + st.label + '</span>';
}

async function renderPage() {
  var today = todayISO();
  var all = await BudgetDB.getAll();

  // KPIs
  var kpi = {
    total:   { count: 0, val: 0 },
    soon:    { count: 0, val: 0 },
    expired: { count: 0, val: 0 },
    open:    { count: 0, val: 0 }
  };
  all.forEach(function(o) {
    var due = o.dueISO || parseValidityToISO(o.extras && o.extras.validade, o.data);
    var dleft = due ? diffDays(due, today) : NaN;
    var st = statusInfoByDleft(dleft);
    var totalVal = o.totalNumber != null ? o.totalNumber : ((o.valores && o.valores.total) || 0);

    kpi.total.count++;
    kpi.total.val += totalVal;

    if (st.key === 'expired') {
      kpi.expired.count++;
      kpi.expired.val += totalVal;
    } else if (st.key === 'soon' || st.key === 'today') {
      kpi.soon.count++;
      kpi.soon.val += totalVal;
    } else {
      kpi.open.count++;
      kpi.open.val += totalVal;
    }
  });
  document.getElementById('kpiTotal').textContent      = kpi.total.count + (kpi.total.count === 1 ? ' orçamento' : ' orçamentos');
  document.getElementById('kpiTotalVal').textContent   = currencyBR(kpi.total.val);
  document.getElementById('kpiSoon').textContent       = kpi.soon.count + (kpi.soon.count === 1 ? ' orçamento' : ' orçamentos');
  document.getElementById('kpiSoonVal').textContent    = currencyBR(kpi.soon.val);
  document.getElementById('kpiExpired').textContent    = kpi.expired.count + (kpi.expired.count === 1 ? ' orçamento' : ' orçamentos');
  document.getElementById('kpiExpiredVal').textContent = currencyBR(kpi.expired.val);
  document.getElementById('kpiOpen').textContent       = kpi.open.count + (kpi.open.count === 1 ? ' orçamento' : ' orçamentos');
  document.getElementById('kpiOpenVal').textContent    = currencyBR(kpi.open.val);

  // Tabela vencendo em breve
  var list = all.map(function(o) {
    var issue = o.issueISO || parseBRDateToISO(o.data);
    var due   = o.dueISO   || parseValidityToISO(o.extras && o.extras.validade, o.data);
    var dleft = due ? diffDays(due, today) : NaN;
    return Object.assign({}, o, {issue:issue, due:due, dleft:dleft});
  }).filter(function(x) {
    return Number.isFinite(x.dleft) && x.dleft >= 0 && x.dleft <= 10;
  }).sort(function(a,b) { return (a.due||'').localeCompare(b.due||''); });

  document.getElementById('countSoon').textContent = list.length;
  var tbody = document.getElementById('tbodySoon');
  tbody.innerHTML = '';

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Nenhum orcamento vencendo nos proximos 10 dias.</td></tr>';
    return;
  }
  list.forEach(function(qo) {
    var st = statusInfoByDleft(qo.dleft);
    var total = qo.totalNumber != null ? qo.totalNumber : ((qo.valores && qo.valores.total)||0);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="fw-semibold" style="color:var(--brand)">' + (qo.id||'-') + '</td>' +
      '<td>' + (qo.clientName||(qo.client&&qo.client.name)||'-') + '</td>' +
      '<td class="fw-semibold">' + currencyBR(total) + '</td>' +
      '<td class="text-muted">' + fmtBR(qo.issue) + '</td>' +
      '<td class="text-muted">' + fmtBR(qo.due) + '</td>' +
      '<td>' + makeBadge(st) + '</td>' +
      '<td><a class="btn btn-sm btn-outline-secondary btn-table-action" href="cadastro.html?id=' + encodeURIComponent(qo.id) + '"><i class="fa-solid fa-pen-to-square"></i></a></td>';
    tbody.appendChild(tr);
  });
}

document.getElementById('btnNovo').addEventListener('click', function() {
  try { localStorage.removeItem('currentBudgetId'); } catch(e) {}
});

checkAuth().then(function(user) {
  if (user) {
    BudgetDB.migrateFromLocalStorage().then(function() { renderPage(); });
  }
});
</script>
</body>
</html>
