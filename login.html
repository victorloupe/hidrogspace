<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Hidro G</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="manifest" href="manifest.json?v=5">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body { padding-top: 0 !important; }
  </style>
</head>
<body class="login-container">

<div class="login-card text-center">
  <img src="logohidrog.png" alt="Hidro G" class="mb-4" style="height: 60px;">
  <h5 class="fw-bold mb-1">Acesso ao Sistema</h5>
  <p class="text-muted mb-4" style="font-size: .85rem;">Entre com suas credenciais para gerenciar orçamentos</p>


  <form id="loginForm">
    <div class="mb-3 text-start">
      <label for="email" class="form-label" style="font-size: .82rem; color: #475569;">E-mail</label>
      <div class="input-group">
        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-regular fa-envelope"></i></span>
        <input type="email" class="form-control border-start-0" id="email" required placeholder="exemplo@hidrog.com.br" autocomplete="username">
      </div>
    </div>

    <div class="mb-4 text-start">
      <label for="password" class="form-label" style="font-size: .82rem; color: #475569;">Senha</label>
      <div class="input-group">
        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
        <input type="password" class="form-control border-start-0 border-end-0" id="password" required placeholder="Digite sua senha" autocomplete="current-password">
        <button class="btn btn-soft-secondary border-start-0" type="button" id="togglePassword">
          <i class="fa-regular fa-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn-brand w-100 py-2 d-flex align-items-center justify-content-center gap-2" id="btnSubmit">
      <span>Entrar</span>
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="utils.js?v=5"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  // Se já estiver logado, redireciona direto para o painel
  var res = await getSupa().auth.getSession();
  if (res.data && res.data.session) {
    window.location.href = 'index.html';
    return;
  }

  // Alternar visualização de senha
  var toggleBtn = document.getElementById('togglePassword');
  var passInput = document.getElementById('password');
  var eyeIcon = document.getElementById('eyeIcon');
  if (toggleBtn && passInput) {
    toggleBtn.addEventListener('click', function() {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-regular fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-regular fa-eye';
      }
    });
  }

  // Manipular submit do formulário
  var form = document.getElementById('loginForm');
  var btnSubmit = document.getElementById('btnSubmit');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      alert('Por favor, preencha todos os campos.');
      return;
    }

    // Desabilitar botão e mostrar loading
    btnSubmit.disabled = true;
    var origText = btnSubmit.innerHTML;
    btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> <span>Acessando...</span>';

    try {
      var signInRes = await getSupa().auth.signInWithPassword({
        email: email,
        password: password
      });

      if (signInRes.error) {
        throw signInRes.error;
      }

      // Sucesso!
      window.location.href = 'index.html';
    } catch(err) {
      console.error(err);
      var errMsg = 'Ocorreu um erro ao fazer login. Tente novamente.';
      if (err.message === 'Invalid login credentials') {
        errMsg = 'E-mail ou senha inválidos.';
      } else if (err.message) {
        errMsg = err.message;
      }
      alert(errMsg);
      
      // Restaurar botão
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = origText;
    }
  });
});
</script>
</body>
</html>
