<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatorio - Hidro G</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header navbar navbar-expand-md navbar-light">
  <div class="container-fluid p-0 d-flex align-items-center justify-content-between flex-wrap flex-md-nowrap">
    <img src="logohidrog.png" alt="Hidro G" style="height:50px;">
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#headerNav" aria-controls="headerNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="headerNav">
      <nav class="d-flex flex-column flex-md-row gap-2 ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="index.html"><i class="fa-solid fa-house"></i> Menu</a>
        <a class="btn btn-brand btn-sm text-white" href="relatorio.html"><i class="fa-solid fa-table-list"></i> Relatorio</a>
        <a class="btn btn-outline-secondary btn-sm" href="cadastro.html"><i class="fa-solid fa-plus"></i> Novo</a>
        <button class="btn btn-sm btn-outline-danger no-print" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </nav>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Chips de resumo -->
  <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="kpiChips">
    <span class="chip" style="background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; font-weight: 500;">Total: <b id="k_total" style="color:#1d4ed8;">0</b></span>
    <span class="chip" style="background:#fef3c7; color:#92400e; border-color:#fcd34d; font-weight: 500;">Vence hoje: <b id="k_today" style="color:#92400e;">0</b></span>
    <span class="chip" style="background:#ede9fe; color:#5b21b6; border-color:#c4b5fd; font-weight: 500;">Em breve: <b id="k_soon" style="color:#5b21b6;">0</b></span>
    <span class="chip" style="background:#fee2e2; color:#991b1b; border-color:#fca5a5; font-weight: 500;">Vencidos: <b id="k_expired" style="color:#991b1b;">0</b></span>
    <span class="chip" style="background:#d1fae5; color:#065f46; border-color:#6ee7b7; font-weight: 500;">Abertos: <b id="k_open" style="color:#065f46;">0</b></span>
  </div>

  <!-- Card principal -->
  <div class="card">
    <div class="card-body p-0">

      <!-- Barra de ferramentas -->
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-4 py-3 border-bottom no-print">
        <h6 class="mb-0 fw-bold d-flex align-items-center gap-2">
          <i class="fa-solid fa-list" style="color:var(--brand)"></i>
          Todos os Orçamentos
        </h6>
        <div class="d-flex gap-2 flex-wrap">
          <div class="input-group input-group-sm" style="width:240px">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input id="searchInput" type="search" class="form-control border-start-0"
                   placeholder="Cliente ou #ID">
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="btnClear" title="Limpar">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="btnExportJSON" title="Backup JSON">
            <i class="fa-solid fa-download"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary no-print" onclick="window.print()" title="Imprimir">
            <i class="fa-solid fa-print"></i>
          </button>
        </div>
      </div>

      <!-- Filtros rapidos -->
      <div class="d-flex flex-wrap align-items-center gap-2 px-4 py-2 border-bottom no-print" style="background:#fafafa">
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-filter active" data-filter="all">Todos</button>
          <button class="btn btn-sm btn-filter" data-filter="today">Vence Hoje</button>
          <button class="btn btn-sm btn-filter" data-filter="soon_only">Em Breve</button>
          <button class="btn btn-sm btn-filter" data-filter="expired">Vencidos</button>
          <button class="btn btn-sm btn-filter" data-filter="ok">Abertos</button>
        </div>
        <div class="d-flex align-items-center gap-1 ms-md-auto mt-2 mt-md-0 period-container" style="font-size: .8rem; color: var(--text-muted);">
          <span>Período:</span>
          <input type="date" id="filterDateStart" class="form-control form-control-sm" style="width:130px; display:inline-block;">
          <span>até</span>
          <input type="date" id="filterDateEnd" class="form-control form-control-sm" style="width:130px; display:inline-block;">
          <button class="btn btn-sm btn-outline-secondary" id="btnClearDates" title="Limpar Período"><i class="fa-solid fa-eraser"></i></button>
        </div>
      </div>

      <!-- Tabela -->
      <div class="table-responsive">
        <table class="table mb-0" style="min-width: 850px;">
          <thead>
            <tr>
              <th style="width:140px; cursor:pointer;" class="sortable-th active-sort" data-sort="id"># <i class="fa-solid fa-sort-down ms-1"></i></th>
              <th style="cursor:pointer;" class="sortable-th" data-sort="client">Cliente <i class="fa-solid fa-sort ms-1 opacity-50"></i></th>
              <th style="width:130px; cursor:pointer;" class="sortable-th" data-sort="total">Total <i class="fa-solid fa-sort ms-1 opacity-50"></i></th>
              <th style="width:115px; cursor:pointer;" class="sortable-th" data-sort="issue">Emissão <i class="fa-solid fa-sort ms-1 opacity-50"></i></th>
              <th style="width:115px; cursor:pointer;" class="sortable-th" data-sort="due">Validade <i class="fa-solid fa-sort ms-1 opacity-50"></i></th>
              <th style="width:140px">Status</th>
              <th class="no-print" style="width:165px"></th>
            </tr>
          </thead>
          <tbody id="tbodyAll">
            <tr>
              <td colspan="7" class="text-center py-4">
                <div class="water-loader">
                  <div class="drop"></div>
                  <div class="wave"></div>
                  <div class="loader-text">Carregando orçamentos...</div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>



<style>
.btn-filter {
  border-radius: 999px; font-size:.78rem; padding:3px 12px;
  background:transparent; border:1px solid var(--border); color:var(--text-muted);
  transition:all .15s;
}
.btn-filter.active, .btn-filter:hover {
  background:var(--brand); border-color:var(--brand); color:#fff;
}
.sortable-th {
  user-select: none;
  transition: background-color 0.2s, color 0.2s;
}
.sortable-th:hover {
  background-color: #f1f5f9 !important;
}
.sortable-th.active-sort {
  color: var(--brand) !important;
}
.sortable-th.active-sort i {
  opacity: 1 !important;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.6.0/dist/jspdf.plugin.autotable.min.js"></script>
<script src="utils.js"></script>
<script>
var allBudgets = [];
var activeFilter = 'all';
var searchQ = '';
var sortColumn = 'id';
var sortDirection = 'desc';

function makeBadge(st) {
  return '<span class="badge-status ' + st.key + '">' + st.label + '</span>';
}

function escapeHtml(string) {
  return String(string)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function highlightText(text, query) {
  if (!text) return '';
  if (!query) return escapeHtml(text);
  var escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
  var regex = new RegExp('(' + escapedQuery + ')', 'gi');
  return escapeHtml(text).replace(regex, '<mark style="background:#fef08a; color:#854d0e; padding:0 2px; border-radius:3px;">$1</mark>');
}

function getFiltered() {
  var today = todayISO();
  var dateStartVal = document.getElementById('filterDateStart') ? document.getElementById('filterDateStart').value : '';
  var dateEndVal = document.getElementById('filterDateEnd') ? document.getElementById('filterDateEnd').value : '';

  var filtered = allBudgets.filter(function(o) {
    var due   = o.dueISO || parseValidityToISO(o.extras && o.extras.validade, o.data);
    var dleft = due ? diffDays(due, today) : NaN;
    var st    = statusInfoByDleft(dleft);
    var passFilter = (
      activeFilter === 'all' ||
      (activeFilter === 'expired' && st.key === 'expired') ||
      (activeFilter === 'soon'    && (st.key === 'soon' || st.key === 'today')) ||
      (activeFilter === 'today'   && st.key === 'today') ||
      (activeFilter === 'soon_only' && st.key === 'soon') ||
      (activeFilter === 'ok'      && (st.key === 'ok' || st.key === 'open'))
    );
    var total = o.totalNumber != null ? o.totalNumber : ((o.valores && o.valores.total)||0);
    var formattedTotal = currencyBR(total).toLowerCase();
    
    var passSearch = !searchQ ||
      (o.id||'').toLowerCase().includes(searchQ) ||
      (o.clientName||'').toLowerCase().includes(searchQ) ||
      String(total).includes(searchQ) ||
      formattedTotal.includes(searchQ);

    var passDates = true;
    var issue = o.issueISO || parseBRDateToISO(o.data);
    if (issue) {
      if (dateStartVal && issue < dateStartVal) passDates = false;
      if (dateEndVal && issue > dateEndVal) passDates = false;
    } else if (dateStartVal || dateEndVal) {
      passDates = false;
    }

    return passFilter && passSearch && passDates;
  });

  filtered.sort(function(a, b) {
    var valA, valB;
    if (sortColumn === 'id') {
      valA = a.id || '';
      valB = b.id || '';
    } else if (sortColumn === 'client') {
      valA = a.clientName || (a.client && a.client.name) || '';
      valB = b.clientName || (b.client && b.client.name) || '';
    } else if (sortColumn === 'total') {
      valA = a.totalNumber != null ? a.totalNumber : ((a.valores && a.valores.total)||0);
      valB = b.totalNumber != null ? b.totalNumber : ((b.valores && b.valores.total)||0);
    } else if (sortColumn === 'issue') {
      valA = a.issueISO || parseBRDateToISO(a.data) || '';
      valB = b.issueISO || parseBRDateToISO(b.data) || '';
    } else if (sortColumn === 'due') {
      valA = a.dueISO || parseValidityToISO(a.extras && a.extras.validade, a.data) || '';
      valB = b.dueISO || parseValidityToISO(b.extras && b.extras.validade, b.data) || '';
    }

    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
    return 0;
  });

  return filtered;
}

function renderTable() {
  var today  = todayISO();
  var list   = getFiltered();
  var tbody  = document.getElementById('tbodyAll');
  var counts = {total:allBudgets.length, today:0, soon:0, expired:0, open:0};

  allBudgets.forEach(function(o) {
    var due   = o.dueISO || parseValidityToISO(o.extras && o.extras.validade, o.data);
    var dleft = due ? diffDays(due, today) : NaN;
    var st    = statusInfoByDleft(dleft);
    counts[st.key] = (counts[st.key]||0) + 1;
  });
  document.getElementById('k_total').textContent   = counts.total;
  document.getElementById('k_today').textContent   = counts.today   || 0;
  document.getElementById('k_soon').textContent    = counts.soon    || 0;
  document.getElementById('k_expired').textContent = counts.expired || 0;
  document.getElementById('k_open').textContent    = (counts.ok||0) + (counts.open||0);

  tbody.innerHTML = '';
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted"><i class="fa-solid fa-inbox fa-2x d-block mb-2 opacity-25"></i>Nenhum orçamento encontrado.</td></tr>';
    return;
  }
  list.forEach(function(o) {
    var issue = o.issueISO || parseBRDateToISO(o.data);
    var due   = o.dueISO   || parseValidityToISO(o.extras && o.extras.validade, o.data);
    var dleft = due ? diffDays(due, today) : NaN;
    var st    = statusInfoByDleft(dleft);
    var total = o.totalNumber != null ? o.totalNumber : ((o.valores && o.valores.total)||0);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><span class="fw-semibold" style="color:var(--brand)">' + highlightText(o.id, searchQ) + '</span></td>' +
      '<td><span class="fw-medium">' + highlightText(o.clientName||(o.client&&o.client.name)||'-', searchQ) + '</span></td>' +
      '<td class="fw-semibold">' + currencyBR(total) + '</td>' +
      '<td class="text-muted">' + fmtBR(issue) + '</td>' +
      '<td class="text-muted">' + fmtBR(due) + '</td>' +
      '<td>' + makeBadge(st) + '</td>' +
      '<td class="no-print text-nowrap">' +
        '<a class="btn btn-sm btn-outline-secondary btn-table-action me-1" href="cadastro.html?id=' + encodeURIComponent(o.id) + '" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>' +
        '<button class="btn btn-sm btn-outline-success btn-table-action btn-print me-1" data-id="' + o.id + '" title="Imprimir"><i class="fa-solid fa-print"></i></button>' +
        '<a class="btn btn-sm btn-outline-primary btn-table-action me-1" href="cadastro.html?duplicateId=' + encodeURIComponent(o.id) + '" title="Duplicar"><i class="fa-regular fa-copy"></i></a>' +
        '<button class="btn btn-sm btn-outline-danger btn-table-action btn-del" data-id="' + o.id + '" title="Excluir"><i class="fa-solid fa-trash"></i></button>' +
      '</td>';
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('.btn-print').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.dataset.id;
      var budget = allBudgets.find(function(item) { return item.id === id; });
      if (budget) {
        gerarPDF(budget, false);
      }
    });
  });

  tbody.querySelectorAll('.btn-del').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.dataset.id;
      sysConfirm('Deseja realmente excluir o orçamento #' + id + '? Esta ação não pode ser desfeita.', async function() {
        await BudgetDB.remove(id);
        allBudgets = allBudgets.filter(function(o) { return o.id !== id; });
        renderTable();
      });
    });
  });
}

function exportarJSON() {
  var blob = new Blob([JSON.stringify(allBudgets, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hidrog_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function updateSortHeaders() {
  document.querySelectorAll('.sortable-th').forEach(function(th) {
    th.classList.remove('active-sort');
    var icon = th.querySelector('i');
    if (icon) {
      icon.className = 'fa-solid fa-sort ms-1 opacity-50';
    }
    if (th.dataset.sort === sortColumn) {
      th.classList.add('active-sort');
      if (icon) {
        icon.className = 'fa-solid fa-sort-' + (sortDirection === 'asc' ? 'up' : 'down') + ' ms-1';
      }
    }
  });
}

// Destaque visual do chip de KPI ativo
function updateActiveChipHighlight() {
  document.querySelectorAll('#kpiChips .chip').forEach(function(chip) {
    chip.classList.remove('active-filter');
  });
  if (activeFilter === 'all') {
    var el = document.getElementById('k_total');
    if (el) el.closest('.chip').classList.add('active-filter');
  } else if (activeFilter === 'today') {
    var cToday = document.getElementById('k_today');
    if (cToday) cToday.closest('.chip').classList.add('active-filter');
  } else if (activeFilter === 'soon_only') {
    var cSoon = document.getElementById('k_soon');
    if (cSoon) cSoon.closest('.chip').classList.add('active-filter');
  } else if (activeFilter === 'soon') {
    // Se clicar no botão de filtro geral 'Vencendo', destaca ambos
    var cToday = document.getElementById('k_today');
    if (cToday) cToday.closest('.chip').classList.add('active-filter');
    var cSoon = document.getElementById('k_soon');
    if (cSoon) cSoon.closest('.chip').classList.add('active-filter');
  } else if (activeFilter === 'expired') {
    var el = document.getElementById('k_expired');
    if (el) el.closest('.chip').classList.add('active-filter');
  } else if (activeFilter === 'ok') {
    var el = document.getElementById('k_open');
    if (el) el.closest('.chip').classList.add('active-filter');
  }
}

document.addEventListener('DOMContentLoaded', async function() {
  var user = await checkAuth();
  if (!user) return;

  var startTime = Date.now();
  await BudgetDB.migrateFromLocalStorage();
  allBudgets = (await BudgetDB.getAll()).filter(Boolean);

  // Garante que o efeito completo da gota (1.8s) seja finalizado antes de renderizar
  var elapsed = Date.now() - startTime;
  var minDuration = 1800;
  if (elapsed < minDuration) {
    await new Promise(function(resolve) { setTimeout(resolve, minDuration - elapsed); });
  }
  renderTable();
  updateActiveChipHighlight();

  document.getElementById('searchInput').addEventListener('input', function() {
    searchQ = this.value.toLowerCase().trim();
    renderTable();
  });
  document.getElementById('btnClear').addEventListener('click', function() {
    document.getElementById('searchInput').value = '';
    searchQ = '';
    renderTable();
  });
  document.getElementById('btnExportJSON').addEventListener('click', exportarJSON);

  document.querySelectorAll('.btn-filter').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.btn-filter').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      updateActiveChipHighlight();
      renderTable();
    });
  });

  // Filtros de Data
  document.getElementById('filterDateStart').addEventListener('change', renderTable);
  document.getElementById('filterDateEnd').addEventListener('change', renderTable);
  document.getElementById('btnClearDates').addEventListener('click', function() {
    document.getElementById('filterDateStart').value = '';
    document.getElementById('filterDateEnd').value = '';
    renderTable();
  });

  // Mapeamento de cliques nos chips de KPI para ativar filtros de forma independente
  var chipMapping = {
    'k_total': 'all',
    'k_today': 'today',
    'k_soon': 'soon_only',
    'k_expired': 'expired',
    'k_open': 'ok'
  };
  Object.keys(chipMapping).forEach(function(chipId) {
    var element = document.getElementById(chipId);
    if (element) {
      var chipEl = element.closest('.chip');
      if (chipEl) {
        chipEl.classList.add('chip-clickable');
        chipEl.addEventListener('click', function() {
          activeFilter = chipMapping[chipId];
          
          // Ajusta a classe active nos botões cinzas do filtro rápido de acordo com a seleção
          document.querySelectorAll('.btn-filter').forEach(function(b) { b.classList.remove('active'); });
          var btn = document.querySelector('.btn-filter[data-filter="' + activeFilter + '"]');
          if (btn) btn.classList.add('active');
          
          updateActiveChipHighlight();
          renderTable();
        });
      }
    }
  });

  // Ordenação de colunas
  document.querySelectorAll('.sortable-th').forEach(function(th) {
    th.addEventListener('click', function() {
      var col = th.dataset.sort;
      if (sortColumn === col) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = col;
        sortDirection = 'asc';
      }
      updateSortHeaders();
      renderTable();
    });
  });

  // Inicializa visualmente os ícones de ordenação
  updateSortHeaders();
});
</script>
</body>
</html>
