document.getElementById('btnInserir').addEventListener('click', async function() {
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Inserindo...';
  log.innerHTML = '';
  addLog('Conectando ao Supabase...', 'info');

  var ok = 0, err = 0;
  for (var i = 0; i < orcamentos.length; i++) {
    var o = orcamentos[i];
    try {
      await BudgetDB.save(o);
      addLog('OK: ' + o.id + ' - ' + o.clientName + ' - R$ ' + o.totalNumber.toLocaleString('pt-BR'), 'success');
      ok++;
    } catch(e) {
      addLog('ERRO em ' + o.id + ': ' + e.message, 'danger');
      err++;
    }
  }

  if (ok > 0) {
    addLog(ok + ' orcamento(s) inseridos com sucesso! Vá para o Menu para visualizar.', 'success');
    document.querySelector('a[href="index.html"]').className = 'btn btn-success ms-2';
  }
  if (err > 0) {
    addLog(err + ' erro(s). Verifique se o SQL foi executado no Supabase.', 'warning');
  }

  btn.disabled = false;
  btn.textContent = 'Inserir novamente';
});
